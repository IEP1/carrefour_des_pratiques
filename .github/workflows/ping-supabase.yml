name: Garder Supabase actif

# Le plan gratuit Supabase met un projet en pause après 7 jours sans requête.
# Cette tâche fait une lecture minimale toutes les 3 jours pour l'éviter.
on:
  schedule:
    - cron: '0 3 */3 * *'   # tous les 3 jours à 3h UTC
  workflow_dispatch:         # permet un déclenchement manuel depuis l'onglet Actions

